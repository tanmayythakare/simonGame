<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimonSays Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon says Game</h1>
    <h2>Press any key to start the game</h2>
    <div class="btn-container">
        <div class="line-one">
            <button class="btn red" id="red"type=button></button>
            <button class="btn yellow" id="yellow"type=button></button>
        </div>
        <div class="line-two">
            <button class="btn green" id="green"type=button></button>
            <button class="btn blue" id="blue"type=button></button>
        </div>        
    </div>
    <script src="app.js"></script>
</body>
</html>
